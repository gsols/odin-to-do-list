<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To do</title>
<script defer src="main.js"></script></head>

<body>
    <div class="side-bar">
        <div class="header">To do</div>
        <nav class="side-nav">
            <div>
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><title>plus</title><path d="M19,13H13V19H11V13H5V11H11V5H13V11H19V13Z" /></svg>
                Add Task
            </div>
            <div class="nav-btn" id="lonely-tasks">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><title>tray-minus</title><path d="M16 10H8V8H16M2 17A2 2 0 0 0 4 19H20A2 2 0 0 0 22 17V12H20V17H4V12H2Z" /></svg>
                Lonely Tasks
            </div>
            <div class="nav-btn" id="today">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><title>calendar-account-outline</title><path d="M19 3H18V1H16V3H8V1H6V3H5C3.9 3 3 3.9 3 5V19C3 20.11 3.9 21 5 21H19C20.11 21 21 20.11 21 19V5C21 3.9 20.11 3 19 3M19 19H5V9H19V19M19 7H5V5H19M12 10C14 10 15 12.42 13.59 13.84C12.17 15.26 9.75 14.25 9.75 12.25C9.75 11 10.75 10 12 10M16.5 17.88V18H7.5V17.88C7.5 16.63 9.5 15.63 12 15.63S16.5 16.63 16.5 17.88Z" /></svg>
                Today
            </div>
            <div class="nav-btn" id="completed-tasks">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><title>check</title><path d="M9,16.17L4.83,12L3.41,13.41L9,19L21,7L19.59,5.58L9,16.17Z" /></svg>
                Completed Tasks
            </div>
        </nav>
        <div class="projects-div">
            <div class="header">
                My Projects
                <button id="add-project-btn" type="button" aria-label="Add project">
                    +
                </button>
            </div>
            <div class="projects-list">
                <!-- Project names will be rendered here -->
            </div>
        </div>
    </div>
    <div id="content"></div>    
</body>

</html>
